[project]
name = "emojihash"
version = "0.1.0"
description = "Map arbitrary input to a single emoji. Not cryptographically secure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elliott Indiran" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
emojihash = "emojihash.cli:main"

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff", "ty"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Enable pycodestyle (`E`, `W`), Pyflakes (`F`), flake8-bugbear (`B`),
# pydocstyle (`D`), Ruff (`RUF`), pyupgrade (`UP`), flake8-async (`ASYNC`),
# PyLint (`PL`), flake8-annotation (`ANN`), Pandas-specific (`PD`),
# Numpy (`NPY`), type hint (`TC`), isort (`I`), pep8-naming (`N`),
# flake8-comprehensions (`C4`), and flake8-simplify (`SIM`) codes.
select = ["E", "W", "F", "B", "D", "RUF", "UP", "ASYNC", "PL", "ANN", "PD", "NPY", "TC", "I", "N", "C4", "SIM"]
ignore = [
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ANN401", # any-type
    "D200",  # fits-on-one-line
    "D203",  # one-blank-line-before-class
    "D204",  # one-blank-line-after-class
    "D205",  # blank-line-after-summary
    "D206",  # indent-with-spaces
    "D212",  # multi-line-summary-first-line
    "D400",  # ends-in-period
    "D401",  # non-imperative-mood
    "D415",  # ends-in-punctuation
    "D404",  # docstring-starts-with-this
    "E741",  # ambiguous-variable-name
    "D105",  # undocumented-magic-method
]

[tool.ruff.lint.per-file-ignores]
# Test functions are self-describing; magic values are the expected outputs.
"tests/**" = ["D103", "PLR2004"]
# The table includes emoji that resemble ASCII, e.g. HEAVY PLUS SIGN.
"src/emojihash/_table.py" = ["RUF001"]

[tool.ty.environment]
extra-paths = ["src"]
